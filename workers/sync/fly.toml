# fly.toml — Blackwood sync worker.
#
# Scale-to-zero: auto_stop_machines + min_machines_running=0 means the machine sleeps
# when idle (~$0 idle cost) and Fly AUTO-STARTS it on the inbound POST /kick request.
# If a kick is ever lost (machine asleep, request dropped), the queued sync_runs row
# still gets picked up by DBOS recovery the next time the worker wakes — nothing is
# lost, it just waits (visible as "queued" in the modal).
#
# Rename `app` before first deploy. Set the region near the Supabase project
# (ap-northeast-1 / Tokyo, matching the Supabase pooler host aws-1-ap-northeast-1).
# Secrets are set with `flyctl secrets set …` (see .env.example) — never committed.

app = "blackwood-sync"
primary_region = "nrt"   # Tokyo — closest to the Supabase ap-northeast-1 project

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"     # sleep when idle
  auto_start_machines = true       # wake on the /kick request
  min_machines_running = 0         # scale to zero → ~$0 idle cost

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  # Health check so Fly considers the machine ready before routing /kick.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"    # exceljs on the larger workbooks (FLECON/Czarina ~400KB) is fine at 512MB
