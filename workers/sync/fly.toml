# fly.toml — Blackwood sync worker.
#
# BULLETPROOF mode (Renzo's choice, 2026-07-05): min_machines_running = 1 keeps ONE
# tiny machine always awake (~$2-3/mo). This trades ~$0 idle cost for total
# reliability: no cold-start delay on a click, and — critically — the machine can
# NEVER be napped mid-sync (Fly judges idleness by web traffic, but our sync runs in
# the background after the /kick returns, so scale-to-zero risked a stop mid-run).
# A kick that's ever lost is still recovered by DBOS on the next wake — nothing is
# lost — but with min=1 the worker is always up to receive it (no "queued" wait).
#
# To go cheaper later (true scale-to-zero, ~pennies, tiny mid-run-stop risk): set
# min_machines_running = 0. One line, nothing else changes.
#
# Rename `app` before first deploy. Set the region near the Supabase project
# (ap-northeast-1 / Tokyo, matching the Supabase pooler host aws-1-ap-northeast-1).
# Secrets are set with `flyctl secrets set …` (see .env.example) — never committed.

app = "blackwood-sync"
primary_region = "nrt"   # Tokyo — closest to the Supabase ap-northeast-1 project

[build]
  # THE BUILD CONTEXT IS THE REPO ROOT, not this folder — the worker's Excel report
  # imports the app's finding flattener across the package boundary, so the image has to
  # contain `lib/sync/*` and `app/(app)/sync/types.ts` (full reasoning in the Dockerfile
  # header). Deploy with:
  #
  #     cd workers/sync && npm run deploy
  #
  # which expands to `flyctl deploy .` from the repo root with `--config
  # workers/sync/fly.toml --dockerfile workers/sync/Dockerfile --build-arg BUILD_SHA=…`
  # and runs the `verify:container-build` gate first.
  #
  # MEASURED flyctl behaviour (v0.4.71, 2026-08-08): this path — and the `--dockerfile`
  # flag equally — is resolved relative to the DIRECTORY HOLDING THIS fly.toml, *not*
  # relative to the build context. So it stays `"Dockerfile"` (i.e. workers/sync/Dockerfile)
  # and the context is set by the positional argument to `flyctl deploy` instead. Writing
  # `"workers/sync/Dockerfile"` here looks more correct and is not: flyctl then hunts for
  # workers/sync/workers/sync/Dockerfile and errors.
  #
  # A bare `fly deploy` from inside workers/sync is therefore still wrong — but it fails
  # LOUDLY and immediately on the very first COPY (`"/workers/sync/package.json": not
  # found`, because the context is one level too deep), long before esbuild. Use
  # `npm run deploy`.
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"      # stops only EXTRA machines; the min-1 stays up
  auto_start_machines = true       # wake instantly on the /kick request
  min_machines_running = 1         # BULLETPROOF: keep one tiny machine always awake
                                   # (~$2-3/mo) — no cold start, never naps mid-sync

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  # Health check so Fly considers the machine ready before routing /kick.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"    # exceljs on the larger workbooks (FLECON/Czarina ~400KB) is fine at 512MB
