<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blackwood — Blueprint Warehouse Blocking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            blueprint: {
              bg: '#0a1628',
              dark: '#0d1b2a',
              panel: '#0f2137',
              line: '#1a3a5c',
              lineLight: '#234b72',
              cyan: '#00d4ff',
              cyanDim: '#0ea5e9',
              cyanMuted: 'rgba(0, 212, 255, 0.15)',
              amber: '#f59e0b',
              amberDim: 'rgba(245, 158, 11, 0.2)',
              text: '#94a3b8',
              textBright: '#e2e8f0',
              textDim: '#475569',
            }
          }
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #0a1628;
      color: #94a3b8;
      margin: 0;
      overflow-x: auto;
    }

    /* Blueprint grid dot pattern */
    .blueprint-dots {
      background-image: radial-gradient(circle, rgba(0, 212, 255, 0.06) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Crosshair markers at corners */
    .crosshair {
      position: absolute;
      width: 8px;
      height: 8px;
    }
    .crosshair::before,
    .crosshair::after {
      content: '';
      position: absolute;
      background: rgba(0, 212, 255, 0.3);
    }
    .crosshair::before {
      width: 8px;
      height: 1px;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
    }
    .crosshair::after {
      width: 1px;
      height: 8px;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
    }

    /* Cell styles */
    .cell-empty {
      background: rgba(10, 22, 40, 0.6);
      border: 1px solid rgba(26, 58, 92, 0.4);
    }
    .cell-stored {
      background: rgba(0, 212, 255, 0.06);
      border: 1px solid rgba(0, 212, 255, 0.25);
      box-shadow: 0 0 8px rgba(0, 212, 255, 0.08), inset 0 0 12px rgba(0, 212, 255, 0.03);
    }
    .cell-stored:hover {
      background: rgba(0, 212, 255, 0.12);
      border-color: rgba(0, 212, 255, 0.5);
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.15), inset 0 0 20px rgba(0, 212, 255, 0.05);
    }
    .cell-inuse {
      background: rgba(245, 158, 11, 0.06);
      border: 1px solid rgba(245, 158, 11, 0.3);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.08), inset 0 0 12px rgba(245, 158, 11, 0.03);
      animation: pulse-amber 3s ease-in-out infinite;
    }
    .cell-inuse:hover {
      background: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.55);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.2), inset 0 0 20px rgba(245, 158, 11, 0.06);
      animation: none;
    }

    @keyframes pulse-amber {
      0%, 100% { box-shadow: 0 0 8px rgba(245, 158, 11, 0.08), inset 0 0 12px rgba(245, 158, 11, 0.03); }
      50% { box-shadow: 0 0 14px rgba(245, 158, 11, 0.15), inset 0 0 18px rgba(245, 158, 11, 0.06); }
    }

    /* Tooltip */
    .cell-tooltip {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #0f2137;
      border: 1px solid rgba(0, 212, 255, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 12px rgba(0, 212, 255, 0.1);
      padding: 8px 12px;
      border-radius: 4px;
      white-space: nowrap;
      z-index: 100;
      font-size: 11px;
      pointer-events: none;
    }
    .cell-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: rgba(0, 212, 255, 0.3);
    }
    .cell-occupied:hover .cell-tooltip {
      display: block;
    }

    /* Warehouse label stencil style */
    .whse-label {
      color: rgba(0, 212, 255, 0.12);
      font-size: 80px;
      font-weight: 700;
      line-height: 1;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
      letter-spacing: 0.1em;
    }

    /* Dimension labels */
    .dim-label {
      color: rgba(0, 212, 255, 0.35);
      font-size: 9px;
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    /* Header dashed line effect */
    .dash-line {
      border-top: 1px dashed rgba(0, 212, 255, 0.2);
    }

    /* Summary panel */
    .summary-panel {
      background: rgba(15, 33, 55, 0.8);
      border: 1px solid rgba(0, 212, 255, 0.15);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a1628; }
    ::-webkit-scrollbar-thumb { background: #1a3a5c; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #234b72; }

    /* Legend indicators */
    .legend-stored {
      width: 12px; height: 12px;
      background: rgba(0, 212, 255, 0.15);
      border: 1px solid rgba(0, 212, 255, 0.4);
      box-shadow: 0 0 6px rgba(0, 212, 255, 0.15);
    }
    .legend-inuse {
      width: 12px; height: 12px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.15);
    }
    .legend-empty {
      width: 12px; height: 12px;
      background: rgba(10, 22, 40, 0.6);
      border: 1px solid rgba(26, 58, 92, 0.4);
    }

    /* Compass rose */
    .compass { position: relative; width: 50px; height: 50px; }
    .compass-ring {
      position: absolute; inset: 0;
      border: 1px solid rgba(0, 212, 255, 0.25);
      border-radius: 50%;
    }
    .compass-dir {
      position: absolute;
      font-size: 9px;
      font-weight: 600;
      color: rgba(0, 212, 255, 0.5);
    }
    .compass-n { top: -2px; left: 50%; transform: translateX(-50%); color: rgba(0, 212, 255, 0.8); }
    .compass-s { bottom: -2px; left: 50%; transform: translateX(-50%); }
    .compass-e { right: -4px; top: 50%; transform: translateY(-50%); }
    .compass-w { left: -4px; top: 50%; transform: translateY(-50%); }
    .compass-needle {
      position: absolute;
      top: 50%; left: 50%;
      width: 1px; height: 20px;
      background: linear-gradient(to bottom, rgba(0, 212, 255, 0.8), rgba(245, 158, 11, 0.4));
      transform: translate(-50%, -50%);
    }
    .compass-needle-h {
      position: absolute;
      top: 50%; left: 50%;
      width: 20px; height: 1px;
      background: linear-gradient(to right, rgba(0, 212, 255, 0.3), rgba(0, 212, 255, 0.3));
      transform: translate(-50%, -50%);
    }
    .compass-center {
      position: absolute;
      top: 50%; left: 50%;
      width: 4px; height: 4px;
      background: #00d4ff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 6px rgba(0, 212, 255, 0.5);
    }
  </style>
</head>
<body class="blueprint-dots min-h-screen font-mono">

  <!-- Title Bar -->
  <header class="border-b border-blueprint-line px-8 py-5">
    <div class="max-w-[1800px] mx-auto flex items-center justify-between">
      <div class="flex items-center gap-6">
        <!-- Compass -->
        <div class="compass">
          <div class="compass-ring"></div>
          <div class="compass-dir compass-n">N</div>
          <div class="compass-dir compass-s">S</div>
          <div class="compass-dir compass-e">E</div>
          <div class="compass-dir compass-w">W</div>
          <div class="compass-needle"></div>
          <div class="compass-needle-h"></div>
          <div class="compass-center"></div>
        </div>
        <div>
          <h1 class="text-blueprint-cyan text-sm font-semibold tracking-[0.3em] uppercase">
            Blackwood Charcoal
          </h1>
          <p class="text-blueprint-textDim text-xs tracking-[0.15em] mt-0.5">
            Warehouse Blocking System &mdash; Floor Plan View
          </p>
        </div>
      </div>

      <div class="flex items-center gap-8">
        <!-- Legend -->
        <div class="flex items-center gap-5 text-[10px] tracking-wide">
          <div class="flex items-center gap-2">
            <div class="legend-stored rounded-sm"></div>
            <span class="text-blueprint-text">STORED</span>
          </div>
          <div class="flex items-center gap-2">
            <div class="legend-inuse rounded-sm"></div>
            <span class="text-blueprint-text">IN-USE</span>
          </div>
          <div class="flex items-center gap-2">
            <div class="legend-empty rounded-sm"></div>
            <span class="text-blueprint-textDim">EMPTY</span>
          </div>
        </div>

        <!-- Summary stats -->
        <div class="summary-panel rounded px-4 py-2 flex items-center gap-6 text-[10px]">
          <div>
            <span class="text-blueprint-textDim">TOTAL SLOTS</span>
            <span class="text-blueprint-textBright ml-2 font-semibold" id="totalSlots">220</span>
          </div>
          <div class="w-px h-4 bg-blueprint-line"></div>
          <div>
            <span class="text-blueprint-textDim">OCCUPIED</span>
            <span class="text-blueprint-cyan ml-2 font-semibold" id="totalOccupied">—</span>
          </div>
          <div class="w-px h-4 bg-blueprint-line"></div>
          <div>
            <span class="text-blueprint-textDim">IN-USE</span>
            <span class="text-amber-400 ml-2 font-semibold" id="totalInUse">—</span>
          </div>
          <div class="w-px h-4 bg-blueprint-line"></div>
          <div>
            <span class="text-blueprint-textDim">TOTAL BALANCE</span>
            <span class="text-blueprint-textBright ml-2 font-semibold" id="totalBalance">—</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-[1800px] mx-auto px-8 py-6">
    <!-- Warehouses A & B side by side -->
    <div class="grid grid-cols-1 gap-8" id="warehouseContainer">
      <!-- Warehouses rendered by JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-blueprint-line px-8 py-3 mt-4">
    <div class="max-w-[1800px] mx-auto flex items-center justify-between text-[9px] text-blueprint-textDim tracking-wider">
      <span>DWG: BW-BLOCK-001 &mdash; REV 3</span>
      <span>SCALE: NOT TO SCALE</span>
      <span>DATE: 2026-02-17</span>
      <span>BLACKWOOD CHARCOAL CORP.</span>
    </div>
  </footer>

  <script>
    // =========================================================================
    // DATA
    // =========================================================================
    const warehouseConfig = {
      A: { cols: 20, rows: ['A', 'B', 'C'] },
      B: { cols: 20, rows: ['A', 'B'] },
      C: { cols: 20, rows: ['A', 'B'] },
      D: { cols: 20, rows: ['A', 'B', 'C', 'D'] },
    };

    const mockData = {
      'A-1A':  { batch: 'FEB-26-BLK3',  status: 'STORED', balance: 45000, php: 18.50, bd: 0.552, ash: 3.2, mc: 9.8 },
      'A-2A':  { batch: 'FEB-26-BLK5',  status: 'IN-USE', balance: 12500, php: 19.00, bd: 0.548, ash: 2.8, mc: 10.1 },
      'A-3B':  { batch: 'JAN-26-BLK1',  status: 'STORED', balance: 67000, php: 17.75, bd: 0.561, ash: 3.5, mc: 8.9 },
      'A-5A':  { batch: 'DEC-25-BLK2',  status: 'IN-USE', balance: 8200,  php: 18.25, bd: 0.545, ash: 4.1, mc: 11.2 },
      'A-7C':  { batch: 'JAN-26-BLK4',  status: 'STORED', balance: 52000, php: 18.00, bd: 0.558, ash: 3.0, mc: 9.5 },
      'A-10A': { batch: 'FEB-26-BLK1',  status: 'STORED', balance: 78000, php: 19.25, bd: 0.563, ash: 2.5, mc: 8.7 },
      'A-12B': { batch: 'NOV-25-BLK3',  status: 'IN-USE', balance: 3500,  php: 17.50, bd: 0.540, ash: 4.5, mc: 12.3 },
      'A-15A': { batch: 'FEB-26-BLK7',  status: 'STORED', balance: 41000, php: 18.75, bd: 0.555, ash: 3.1, mc: 9.2 },
      'A-18C': { batch: 'JAN-26-BLK2',  status: 'STORED', balance: 59000, php: 18.50, bd: 0.550, ash: 3.3, mc: 10.0 },
      'A-20A': { batch: 'DEC-25-BLK5',  status: 'IN-USE', balance: 15000, php: 17.80, bd: 0.542, ash: 3.8, mc: 11.5 },

      'B-2A':  { batch: 'FEB-26-BLK2',  status: 'STORED', balance: 55000, php: 18.90, bd: 0.557, ash: 2.9, mc: 9.3 },
      'B-5B':  { batch: 'JAN-26-BLK3',  status: 'IN-USE', balance: 22000, php: 18.10, bd: 0.549, ash: 3.4, mc: 10.5 },
      'B-8A':  { batch: 'DEC-25-BLK4',  status: 'STORED', balance: 38000, php: 17.60, bd: 0.543, ash: 4.0, mc: 11.0 },
      'B-14A': { batch: 'FEB-26-BLK4',  status: 'STORED', balance: 71000, php: 19.10, bd: 0.560, ash: 2.7, mc: 8.8 },
      'B-19B': { batch: 'NOV-25-BLK1',  status: 'IN-USE', balance: 5800,  php: 17.30, bd: 0.538, ash: 4.8, mc: 12.8 },

      'C-3A':  { batch: 'JAN-26-BLK5',  status: 'STORED', balance: 48000, php: 18.40, bd: 0.554, ash: 3.0, mc: 9.6 },
      'C-9B':  { batch: 'FEB-26-BLK6',  status: 'IN-USE', balance: 19000, php: 18.80, bd: 0.551, ash: 3.2, mc: 10.3 },
      'C-15A': { batch: 'SEPT-25-BLK1', status: 'IN-USE', balance: 6500,  php: 16.90, bd: 0.535, ash: 4.3, mc: 12.0 },
      'C-20A': { batch: 'JAN-26-BLK6',  status: 'STORED', balance: 62000, php: 18.60, bd: 0.559, ash: 2.6, mc: 8.5 },

      'D-1A':  { batch: 'FEB-26-BLK8',  status: 'STORED', balance: 73000, php: 19.30, bd: 0.565, ash: 2.4, mc: 8.3 },
      'D-3C':  { batch: 'JAN-26-BLK7',  status: 'IN-USE', balance: 28000, php: 18.20, bd: 0.547, ash: 3.6, mc: 10.8 },
      'D-5D':  { batch: 'DEC-25-BLK1',  status: 'STORED', balance: 44000, php: 17.90, bd: 0.544, ash: 3.9, mc: 11.1 },
      'D-8A':  { batch: 'FEB-26-BLK9',  status: 'STORED', balance: 81000, php: 19.50, bd: 0.568, ash: 2.2, mc: 8.0 },
      'D-10B': { batch: 'NOV-25-BLK2',  status: 'IN-USE', balance: 9800,  php: 17.40, bd: 0.539, ash: 4.6, mc: 12.5 },
      'D-12D': { batch: 'JAN-26-BLK8',  status: 'STORED', balance: 56000, php: 18.30, bd: 0.553, ash: 3.1, mc: 9.7 },
      'D-15A': { batch: 'FEB-26-BLK10', status: 'STORED', balance: 69000, php: 19.00, bd: 0.562, ash: 2.8, mc: 8.6 },
      'D-17C': { batch: 'DEC-25-BLK3',  status: 'IN-USE', balance: 11000, php: 17.70, bd: 0.541, ash: 4.2, mc: 11.8 },
      'D-20A': { batch: 'JAN-26-BLK9',  status: 'STORED', balance: 47000, php: 18.70, bd: 0.556, ash: 3.3, mc: 9.4 },
      'D-20D': { batch: 'FEB-26-BLK11', status: 'STORED', balance: 35000, php: 18.95, bd: 0.558, ash: 2.9, mc: 9.1 },
    };

    // =========================================================================
    // UTILITIES
    // =========================================================================
    function fmtKg(n) {
      return n.toLocaleString('en-PH') + ' kg';
    }
    function fmtPhp(n) {
      return '\u20B1' + n.toFixed(2);
    }

    // =========================================================================
    // RENDER
    // =========================================================================
    function renderWarehouse(whseKey) {
      const config = warehouseConfig[whseKey];
      const container = document.createElement('div');
      container.className = 'relative';

      // Warehouse wrapper
      const wrapper = document.createElement('div');
      wrapper.className = 'summary-panel rounded-lg p-4 relative overflow-hidden';

      // Large background stencil label
      const stencil = document.createElement('div');
      stencil.className = 'whse-label';
      stencil.textContent = whseKey;
      wrapper.appendChild(stencil);

      // Header row: label + dimension
      const header = document.createElement('div');
      header.className = 'flex items-center justify-between mb-3 relative z-10';
      header.innerHTML = `
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1.5">
            <div class="w-2 h-2 rounded-full bg-blueprint-cyan" style="box-shadow: 0 0 6px rgba(0,212,255,0.4);"></div>
            <span class="text-blueprint-cyan text-xs font-semibold tracking-[0.2em]">WAREHOUSE ${whseKey}</span>
          </div>
          <span class="dim-label">${config.cols} &times; ${config.rows.length} &mdash; ${config.cols * config.rows.length} SLOTS</span>
        </div>
        <div class="flex items-center gap-4 text-[10px]">
          <span class="text-blueprint-textDim">OCCUPIED: <span class="text-blueprint-cyan font-semibold" id="occ-${whseKey}">0</span></span>
          <span class="text-blueprint-textDim">BALANCE: <span class="text-blueprint-textBright font-semibold" id="bal-${whseKey}">0</span></span>
        </div>
      `;
      wrapper.appendChild(header);

      // Dash separator
      const dash = document.createElement('div');
      dash.className = 'dash-line mb-3';
      wrapper.appendChild(dash);

      // Grid
      const grid = document.createElement('div');
      grid.className = 'relative z-10';

      // Column numbers header
      const colHeader = document.createElement('div');
      colHeader.className = 'flex';
      // Row label spacer
      colHeader.innerHTML = '<div class="w-6 flex-shrink-0"></div>';
      for (let c = 1; c <= config.cols; c++) {
        const colNum = document.createElement('div');
        colNum.className = 'dim-label text-center flex-1 min-w-0 pb-1';
        colNum.textContent = c;
        colHeader.appendChild(colNum);
      }
      grid.appendChild(colHeader);

      let occupiedCount = 0;
      let balanceSum = 0;

      // Rows
      config.rows.forEach((row) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'flex';

        // Row label
        const rowLabel = document.createElement('div');
        rowLabel.className = 'dim-label w-6 flex-shrink-0 flex items-center justify-center';
        rowLabel.textContent = row;
        rowEl.appendChild(rowLabel);

        for (let c = 1; c <= config.cols; c++) {
          const locKey = `${whseKey}-${c}${row}`;
          const data = mockData[locKey];
          const cell = document.createElement('div');
          cell.className = 'flex-1 min-w-0 relative';
          cell.style.aspectRatio = 'auto';

          const inner = document.createElement('div');
          inner.className = 'mx-px my-px rounded-sm transition-all duration-150';
          inner.style.padding = '3px 2px';
          inner.style.minHeight = config.rows.length <= 2 ? '52px' : '44px';

          if (data) {
            const isInUse = data.status === 'IN-USE';
            inner.className += isInUse ? ' cell-inuse cell-occupied' : ' cell-stored cell-occupied';
            occupiedCount++;
            balanceSum += data.balance;

            // Cell content
            inner.innerHTML = `
              <div class="text-[8px] font-semibold truncate ${isInUse ? 'text-amber-300' : 'text-blueprint-cyan'}" style="line-height:1.3;">
                ${data.batch}
              </div>
              <div class="text-[8px] text-blueprint-textBright font-medium" style="line-height:1.4;">
                ${(data.balance / 1000).toFixed(0)}t
              </div>
              <div class="text-[7px] ${isInUse ? 'text-amber-400/60' : 'text-blueprint-cyan/40'}" style="line-height:1.2;">
                ${data.status}
              </div>
              <div class="cell-tooltip">
                <div class="flex items-center gap-2 mb-1.5">
                  <span class="font-semibold ${isInUse ? 'text-amber-300' : 'text-blueprint-cyan'}">${data.batch}</span>
                  <span class="text-[9px] px-1.5 py-0.5 rounded ${isInUse ? 'bg-amber-400/15 text-amber-300' : 'bg-blueprint-cyanMuted text-blueprint-cyan'}">${data.status}</span>
                </div>
                <div class="text-blueprint-textDim mb-1">LOC: ${locKey}</div>
                <div class="grid grid-cols-2 gap-x-4 gap-y-0.5 text-blueprint-text">
                  <div>BALANCE <span class="text-blueprint-textBright float-right ml-3">${fmtKg(data.balance)}</span></div>
                  <div>PHP/KG <span class="text-blueprint-textBright float-right ml-3">${fmtPhp(data.php)}</span></div>
                  <div>BD <span class="text-blueprint-textBright float-right ml-3">${data.bd.toFixed(3)}</span></div>
                  <div>ASH <span class="text-blueprint-textBright float-right ml-3">${data.ash.toFixed(2)}%</span></div>
                  <div>MC <span class="text-blueprint-textBright float-right ml-3">${data.mc.toFixed(2)}%</span></div>
                </div>
              </div>
            `;
          } else {
            inner.className += ' cell-empty';
            // Show loc ID very faintly on hover via title
            inner.title = locKey;
          }

          cell.appendChild(inner);
          rowEl.appendChild(cell);
        }
        grid.appendChild(rowEl);
      });

      wrapper.appendChild(grid);

      // Dimension line at bottom
      const dimBottom = document.createElement('div');
      dimBottom.className = 'flex items-center gap-2 mt-3 px-6';
      dimBottom.innerHTML = `
        <div class="flex-1 h-px bg-blueprint-line/50 relative">
          <div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-3 border-l border-blueprint-line/50"></div>
          <div class="absolute right-0 top-1/2 -translate-y-1/2 w-1 h-3 border-r border-blueprint-line/50"></div>
        </div>
        <span class="dim-label">${config.cols} COL</span>
        <div class="flex-1 h-px bg-blueprint-line/50 relative">
          <div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-3 border-l border-blueprint-line/50"></div>
          <div class="absolute right-0 top-1/2 -translate-y-1/2 w-1 h-3 border-r border-blueprint-line/50"></div>
        </div>
      `;
      wrapper.appendChild(dimBottom);

      container.appendChild(wrapper);

      // Update per-warehouse stats
      setTimeout(() => {
        const occEl = document.getElementById(`occ-${whseKey}`);
        const balEl = document.getElementById(`bal-${whseKey}`);
        if (occEl) occEl.textContent = occupiedCount;
        if (balEl) balEl.textContent = (balanceSum / 1000).toFixed(0) + 't';
      }, 0);

      return { element: container, occupied: occupiedCount, balance: balanceSum, inUse: Object.entries(mockData).filter(([k, v]) => k.startsWith(whseKey) && v.status === 'IN-USE').length };
    }

    // =========================================================================
    // INIT
    // =========================================================================
    function init() {
      const mainContainer = document.getElementById('warehouseContainer');
      let totalOccupied = 0;
      let totalInUse = 0;
      let totalBalance = 0;

      // Render A and B in a row, then C and D
      const topRow = document.createElement('div');
      topRow.className = 'grid grid-cols-2 gap-6';

      const bottomRow = document.createElement('div');
      bottomRow.className = 'grid grid-cols-2 gap-6 mt-6';

      ['A', 'B', 'C', 'D'].forEach((key, i) => {
        const result = renderWarehouse(key);
        totalOccupied += result.occupied;
        totalInUse += result.inUse;
        totalBalance += result.balance;
        if (i < 2) topRow.appendChild(result.element);
        else bottomRow.appendChild(result.element);
      });

      mainContainer.appendChild(topRow);
      mainContainer.appendChild(bottomRow);

      // Update header summary
      document.getElementById('totalOccupied').textContent = totalOccupied;
      document.getElementById('totalInUse').textContent = totalInUse;
      document.getElementById('totalBalance').textContent = (totalBalance / 1000).toFixed(0) + 't';
    }

    init();
  </script>
</body>
</html>
